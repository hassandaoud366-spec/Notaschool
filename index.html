<title>Notaschool</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------
   Layout concept: a document-administration shell — sticky top bar
   (school identity + trimester switch + live-sync status) above a
   tab strip; a single content pane renders one register. Bulletin
   sheets mimic a real paper report card: ruled table, ink-navy
   header, wax-seal accent. Data lives in a shared store so every
   signed-in collaborator sees the same classes, notes and bulletins
   update live.
   ----------------------------------------------------------------*/
:root{
  --bg:#f3efe4;
  --surface:#fffdf8;
  --surface-2:#ece6d6;
  --ink:#24231c;
  --ink-soft:#6b6454;
  --line:#d8cfb8;
  --accent:#1f3b63;
  --accent-ink:#f6f1e2;
  --accent-soft:#e4ebf3;
  --gold:#9c7a2e;
  --gold-soft:#f1e6c8;
  --good:#2d6a46;
  --good-soft:#e2eee3;
  --warn:#9c5420;
  --warn-soft:#f3e4d3;
  --danger:#8f2a2a;
  --danger-soft:#f4e0e0;
  --shadow: 0 1px 2px rgba(36,35,28,.06), 0 8px 24px -12px rgba(36,35,28,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181d; --surface:#1c2027; --surface-2:#242933; --ink:#ece7d9; --ink-soft:#a5a190;
    --line:#333a46; --accent:#7fa3d6; --accent-ink:#121722; --accent-soft:#232d3d;
    --gold:#d7b96a; --gold-soft:#332a18; --good:#7fc79a; --good-soft:#1c2c21;
    --warn:#e0a26a; --warn-soft:#2e2318; --danger:#e08a8a; --danger-soft:#2e1c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181d; --surface:#1c2027; --surface-2:#242933; --ink:#ece7d9; --ink-soft:#a5a190;
  --line:#333a46; --accent:#7fa3d6; --accent-ink:#121722; --accent-soft:#232d3d;
  --gold:#d7b96a; --gold-soft:#332a18; --good:#7fc79a; --good-soft:#1c2c21;
  --warn:#e0a26a; --warn-soft:#2e2318; --danger:#e08a8a; --danger-soft:#2e1c1c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Public Sans",system-ui,sans-serif; font-size:14px; line-height:1.45;
  padding-left:max(0px, env(safe-area-inset-left, 0px));
  padding-right:max(0px, env(safe-area-inset-right, 0px));
}
h1,h2,h3,.display{font-family:"Fraunces",Georgia,serif; text-wrap:balance}
.mono, input.mono, .tabnum{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit}
::selection{background:var(--gold-soft)}
[hidden]{display:none !important}

/* ---------- App shell ---------- */
.app{min-height:100%; display:flex; flex-direction:column}
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--accent); color:var(--accent-ink); border-bottom:1px solid var(--line)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:21; background:var(--accent)}
.topbar-inner{max-width:1180px; margin:0 auto; padding-block:14px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand-mark{width:34px; height:34px; border-radius:8px; flex:none; background:var(--gold-soft); color:var(--accent); display:flex; align-items:center; justify-content:center}
.brand-text{min-width:0}
.brand-text .t1{font-family:"Fraunces",serif; font-weight:600; font-size:16.5px; line-height:1.1}
.brand-text .t2{font-size:11.5px; opacity:.78; letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.spacer{flex:1}
.sync-pill{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.12); flex:none; white-space:nowrap}
.sync-dot{width:7px; height:7px; border-radius:50%; background:#8fd99f; flex:none}
.sync-dot.busy{background:#e0c25f; animation:pulse 1.1s infinite ease-in-out}
.sync-dot.off{background:#e08a8a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.me-chip{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border-radius:999px; padding:3px 10px 3px 3px; font-size:11.5px; font-weight:600; flex:none}
.me-chip img{width:20px; height:20px; border-radius:50%; display:block}
.term-switch{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.12); border-radius:999px; padding:4px; flex:none}
.term-switch button{border:none; background:transparent; color:var(--accent-ink); opacity:.65; padding:6px 12px; border-radius:999px; cursor:pointer; font-weight:600; font-size:12.5px}
.term-switch button[aria-pressed="true"]{background:var(--surface); color:var(--accent); opacity:1}

.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; max-width:1180px; margin:0 auto; width:100%; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:none; display:flex; align-items:center; gap:7px; border:none; background:transparent; color:var(--accent-ink); opacity:.72; padding:10px 12px; cursor:pointer; font-size:13px; font-weight:600; border-bottom:2px solid transparent; white-space:nowrap}
.tab-btn svg{width:15px; height:15px; flex:none}
.tab-btn[aria-current="true"]{opacity:1; border-bottom-color:var(--gold)}
.tab-btn:hover{opacity:1}

main{flex:1; width:100%}
.content-wrap{max-width:1180px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:22px 48px}

.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.view-head h1{font-size:22px; margin:0 0 4px}
.view-head p{margin:0; color:var(--ink-soft); font-size:13px; max-width:60ch}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:18px; margin-bottom:18px}
.panel > h2{font-size:15px; margin:0 0 14px; display:flex; align-items:center; gap:8px}
.panel > h2 .count{font-family:"Public Sans",sans-serif; font-weight:700; font-size:11px; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 8px}

.field-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px}
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em}
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=email], .field input[type=tel], .field select, .field textarea{
  border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:8px 10px; font-size:13.5px; font-family:inherit; min-width:0;
}
.field textarea{resize:vertical; min-height:64px}
.field input:focus, .field select:focus, .field textarea:focus, button:focus-visible, a:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
input:disabled, select:disabled, textarea:disabled, button:disabled{opacity:.55; cursor:not-allowed}

.btn{display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:8px 13px; font-size:13px; font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{border-color:transparent; background:transparent}
.btn-danger{color:var(--danger)}
.btn-danger:hover{border-color:var(--danger)}
.btn-sm{padding:5px 10px; font-size:12px}
.btn svg{width:14px; height:14px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:560px}
thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); background:var(--surface-2); padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
tbody td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td input[type=text], td input[type=date], td input[type=number], td select{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:6px; padding:6px 8px; font-size:13px; width:100%; min-width:90px}
.thumb{width:32px; height:32px; border-radius:7px; object-fit:cover; border:1px solid var(--line); background:var(--surface-2); flex:none}
.thumb-ph{width:32px; height:32px; border-radius:7px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:none}
.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700}
.pill-good{background:var(--good-soft); color:var(--good)}
.pill-warn{background:var(--warn-soft); color:var(--warn)}
.pill-gold{background:var(--gold-soft); color:var(--gold)}
.pill-muted{background:var(--surface-2); color:var(--ink-soft)}
.empty{padding:28px 12px; text-align:center; color:var(--ink-soft); font-size:13px}
.hint{font-size:12px; color:var(--ink-soft); margin-top:8px}
.confirm-box{display:flex; gap:8px; align-items:center; background:var(--danger-soft); border-radius:8px; padding:6px 8px}
.confirm-box span{font-size:12px; color:var(--danger)}

.logo-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.logo-preview{width:64px; height:64px; border-radius:10px; border:1px solid var(--line); object-fit:cover; background:var(--surface-2)}
.logo-ph{width:64px; height:64px; border-radius:10px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-soft)}

textarea.code{width:100%; min-height:110px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:10px}

.banner{display:flex; gap:10px; align-items:center; border-radius:10px; padding:10px 14px; font-size:12.5px; margin-bottom:16px}
.banner svg{width:16px; height:16px; flex:none}
.banner-info{background:var(--accent-soft); color:var(--accent)}
.banner-warn{background:var(--warn-soft); color:var(--warn)}
tr.row-absent{background:var(--warn-soft)}

/* ---------- Access / loading gate ---------- */
.gate{min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px max(16px, env(safe-area-inset-left,0px))}
.gate-card{max-width:420px; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:28px; text-align:center}
.gate-icon{width:52px; height:52px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 16px}
.gate-card h1{font-size:19px; margin:0 0 8px}
.gate-card p{color:var(--ink-soft); font-size:13px; margin:0 0 6px; line-height:1.6}
.spin{width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin 0.8s linear infinite; margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Bulletin sheet ---------- */
.print-hint{display:flex; gap:10px; align-items:center; background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:10px 14px; font-size:12.5px; margin-bottom:16px}
.print-hint svg{width:16px; height:16px; flex:none}
.sheet{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); padding:28px; margin-bottom:28px; max-width:900px}
.sheet-head{display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:start; border-bottom:2px solid var(--accent); padding-bottom:14px; margin-bottom:14px}
.sheet-crest{width:54px; height:54px; border-radius:10px; object-fit:cover; border:1px solid var(--line)}
.sheet-crest-ph{width:54px; height:54px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center}
.sheet-school .nom{font-family:"Fraunces",serif; font-weight:600; font-size:18px}
.sheet-school .meta{font-size:11.5px; color:var(--ink-soft); line-height:1.6}
.sheet-doc{text-align:right; min-width:150px}
.sheet-doc .titre{font-family:"Fraunces",serif; font-weight:600; font-size:15px; color:var(--accent)}
.sheet-doc .date{font-size:11.5px; color:var(--ink-soft)}
.sheet-id{display:grid; grid-template-columns:1fr auto; gap:16px; margin-bottom:16px}
.sheet-id dl{display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:0; font-size:12.5px}
.sheet-id dt{color:var(--ink-soft)}
.sheet-id dd{margin:0; font-weight:600}
.sheet-id dd.nom-eleve{font-size:15px; font-family:"Fraunces",serif; font-weight:600}
.sheet-photo{width:70px; height:88px; object-fit:cover; border:1px solid var(--line); border-radius:4px}
.sheet-photo-ph{width:70px; height:88px; border:1px dashed var(--line); border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft)}
.sheet table{min-width:0; font-size:12.5px}
.sheet thead th{background:var(--accent-soft); color:var(--accent); border-bottom:1px solid var(--accent)}
.sheet td, .sheet th{border:1px solid var(--line)}
.sheet tbody td.num{text-align:center}
.sheet tfoot td{font-weight:700; background:var(--gold-soft)}
.sheet .matiere-nom{font-weight:700; text-transform:uppercase; font-size:11.5px}
.sheet .ens-nom{color:var(--ink-soft); font-size:11.5px}
.sheet-conseil{display:grid; grid-template-columns:1.4fr 1fr; gap:0; margin-top:16px; border:1px solid var(--line); border-radius:4px; overflow:hidden; font-size:12.5px}
.sheet-conseil > div{padding:12px}
.sheet-conseil .left{border-right:1px solid var(--line)}
.sheet-conseil .ttl{font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:8px}
.cline{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-top:1px solid var(--line)}
.cline:first-of-type{border-top:none}
.cline input, .cline textarea{border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:4px 7px; font-size:12px; font-family:inherit; width:62%}
.seal{width:72px; height:72px; border-radius:50%; border:2px solid var(--accent); color:var(--accent); display:flex; align-items:center; justify-content:center; text-align:center; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin:0 auto 8px; opacity:.6; transform:rotate(-8deg)}
.sig-row{display:flex; justify-content:center}
.bilan-annuel{display:flex; gap:12px; flex-wrap:wrap; margin-top:16px}
.bilan-annuel .table-wrap{flex:1; min-width:180px}
.bilan-annuel table{min-width:0}
.bilan-annuel td:first-child{color:var(--ink-soft)}
.bilan-annuel td:last-child{font-weight:700}

/* ---------- Registre d'appel imprimable ---------- */
.appel-register{max-width:none}
.appel-head{display:grid; grid-template-columns:1.1fr auto 1.1fr; gap:12px; align-items:stretch; margin-bottom:12px}
.appel-box{border:1px solid var(--line); border-radius:4px; padding:8px 12px}
.appel-ecole-nom{font-family:"Fraunces",serif; font-weight:700; font-size:14px}
.appel-ecole-annee{font-size:11.5px; color:var(--ink-soft); margin-top:2px}
.appel-titre{display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:700; font-size:15px; color:var(--accent); text-align:center; white-space:nowrap; padding-inline:18px}
.appel-dates{display:flex; gap:10px}
.appel-date-box{flex:1; font-size:12px}
.appel-date-row{display:flex; align-items:center; gap:6px; margin-bottom:6px}
.appel-date-row input{border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:3px 6px; font-size:11.5px; font-family:inherit}
.appel-jour-row{color:var(--ink-soft)}
.appel-meta{display:flex; justify-content:space-between; gap:16px; font-size:12.5px; margin-bottom:12px; flex-wrap:wrap}
.appel-table{font-size:10.5px}
.appel-table th, .appel-table td{border:1px solid var(--line); padding:4px 5px; text-align:center}
.appel-table thead th{background:var(--accent-soft); color:var(--accent); white-space:nowrap}
.appel-table tbody td:nth-child(2){text-align:left; white-space:nowrap}
.appel-table tbody td, .appel-table tfoot td{min-width:16px; height:20px}
.appel-table tfoot td:first-child{text-align:left; font-weight:700; background:var(--gold-soft); white-space:nowrap}
.appel-nb{font-size:11.5px; color:var(--ink-soft); margin-top:12px}
.appel-nb ol{margin:4px 0 0; padding-left:18px}

@media print{
  @page{ size:A4; margin:12mm; }
  @page appel{ size:A4 landscape; margin:10mm; }
  .topbar, .tabs, .print-hint, .view-head, .panel, .banner{display:none !important}
  body{background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;}
  main, .content-wrap{padding:0; margin:0; max-width:none}
  .sheet{box-shadow:none; border:none; page-break-after:always; margin:0; max-width:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;}
  .sheet:last-of-type{page-break-after:auto}
  .sheet table{page-break-inside:auto}
  .sheet tr{page-break-inside:avoid; page-break-after:auto}
  .sheet thead{display:table-header-group}
  .sheet-conseil, .bilan-annuel{page-break-inside:avoid}
  .appel-register{page:appel}
}
@media (max-width:640px){
  .sheet{padding:18px}
  .sheet-head{grid-template-columns:1fr; text-align:left}
  .sheet-doc{text-align:left}
  .sheet-id{grid-template-columns:1fr}
  .sheet-conseil{grid-template-columns:1fr}
  .sheet-conseil .left{border-right:none; border-bottom:1px solid var(--line)}
  .bilan-annuel{flex-direction:column}
  .appel-head{grid-template-columns:1fr}
  .appel-dates{flex-direction:column}
}
</style>

<div class="app" id="app">
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="spin" id="gateSpin"></div>
      <h1 id="gateTitle">Connexion à Notaschool</h1>
      <p id="gateText">Connectez-vous avec votre compte scolaire Supabase.</p>
      <form id="loginForm" style="text-align:left;margin-top:18px">
        <div class="field"><label>Identifiant</label><input id="loginIdentifiant" type="text" autocomplete="username" required placeholder="Ex. ADMIN001" autocapitalize="characters"></div>
        <div class="field" style="margin-top:10px"><label>Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Mot de passe"></div>
        <button class="btn btn-primary" id="loginButton" type="submit" style="width:100%;justify-content:center;margin-top:14px">Se connecter</button>
      </form>
    </div>
  </div>

  <div class="app" id="shell" hidden>
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" width="19" height="19"><path d="M12 3 3 7l9 4 9-4-9-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 7v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
          <div class="brand-text">
            <div class="t1" id="brandNom">Notaschool</div>
            <div class="t2" id="brandAnnee">Bulletins scolaires partagés</div>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="me-chip" id="meChip" hidden></div>
        <div class="sync-pill" id="syncPill"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Synchronisé</span></div>
        <div class="term-switch" id="termSwitch" role="group" aria-label="Trimestre">
          <button type="button" data-term="1">Trim. 1</button>
          <button type="button" data-term="2">Trim. 2</button>
          <button type="button" data-term="3">Trim. 3</button>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    </div>
    <main><div class="content-wrap" id="content"></div></main>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= Supabase connection ================= */
var supabase = null, viewer = null, viewerProfile = null, canWriteData = true, readOnlyForced = false;
var syncChannel = null, saveQueue = Promise.resolve();
var SUPABASE_URL = window.NOTASCHOOL_SUPABASE_URL || "";
var SUPABASE_ANON_KEY = window.NOTASCHOOL_SUPABASE_ANON_KEY || "";
var IDENTIFIANT_DOMAIN = "@notaschool.internal";
var ROLES_LABELS = { admin:"Administrateur", directeur:"Directeur", enseignant:"Enseignant", secretaire:"Secrétaire" };
function identifiantToEmail(identifiant){ return String(identifiant||'').trim().toLowerCase() + IDENTIFIANT_DOMAIN; }

/* local-only UI preferences (per browser, never shared) */
var LS_KEY = "notaschool_ui_prefs_v1";
function loadUi(){
  var d = { tab:"etablissement", trimestre:1, classeFiltre:"", notesMatiere:"", bulletinMode:"un", bulletinEleve:"", deleteArmed:"", appelMode:"suivi", appelJour1:"", appelJour2:"",
    absDashEleve:"", absDashClasse:"", absDashDateDebut:"", absDashDateFin:"", absDashTrimestre:"", absDashJustifiee:"" };
  try{ var raw = localStorage.getItem(LS_KEY); if(raw) return Object.assign(d, JSON.parse(raw)); }catch(e){}
  return d;
}
function saveUi(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(ui)); }catch(e){} }
var ui = loadUi();

/* ================= shared cache, fed by live snapshots ================= */
var appelSelection = {};
var cache = {
  school: { nom:"CEM-Lycée de Bouya", telephone:"", email:"", anneeScolaire:"" },
  classes: [], eleves: [], matieres: [],
  notes: {},    // key eleveId_matiereId_trimestre -> {valeurs, appreciation, eleveId, matiereId, trimestre}
  conseil: {},  // key eleveId_trimestre -> {absences, appreciationGlobale, date, eleveId, trimestre}
  appels: {},   // key date_classe_eleve -> {date, classeId, eleveId, statut}
  profiles: [],  // utilisateurs (comptes), rempli uniquement pour les admins
  loaded: { school:false, classes:false, eleves:false, matieres:false, notes:false, conseil:false }
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function frDate(iso){ if(!iso) return "—"; var p = iso.split("-"); if(p.length!==3) return iso; return p[2]+"-"+p[1]+"-"+p[0]; }
function addDaysISO(iso, n){ var d = iso ? new Date(iso+"T00:00:00") : new Date(); if(isNaN(d.getTime())) d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
/* Trimestre déduit du mois de la date : Trim1 sept-nov, Trim2 déc-fév, Trim3 mars-mai. */
function trimestreFromDate(iso){
  if(!iso) return null;
  var m = parseInt(String(iso).split("-")[1],10);
  if(m===9||m===10||m===11) return 1;
  if(m===12||m===1||m===2) return 2;
  if(m===3||m===4||m===5) return 3;
  return null;
}

/* ================= boot and authentication ================= */
function allCoreLoaded(){ return cache.loaded.school && cache.loaded.classes && cache.loaded.eleves && cache.loaded.matieres && cache.loaded.notes && cache.loaded.conseil; }
var firstPaintDone = false;
function showGateError(msg){
  var spin=document.getElementById('gateSpin'); if(spin) spin.style.display='none';
  document.getElementById('gateTitle').textContent='Connexion impossible';
  document.getElementById('gateText').textContent=msg;
}
function revealShell(){
  if(firstPaintDone) return; firstPaintDone=true;
  document.getElementById('gate').hidden=true; document.getElementById('shell').hidden=false;
  renderMeChip(); render();
  if(canManageUsers()) loadProfiles();
}
function markAllLoaded(){ cache.loaded={school:true,classes:true,eleves:true,matieres:true,notes:true,conseil:true}; }
function payloadFromCache(){ return {school:cache.school,classes:cache.classes,eleves:cache.eleves,matieres:cache.matieres,notes:cache.notes,conseil:cache.conseil,appels:cache.appels}; }
function applyPayload(p){
  p=p||{}; cache.school=Object.assign({nom:'CEM-Lycée de Bouya',telephone:'',email:'',anneeScolaire:'',logo:''},p.school||{});
  cache.classes=Array.isArray(p.classes)?p.classes:[]; cache.eleves=Array.isArray(p.eleves)?p.eleves:[];
  cache.matieres=Array.isArray(p.matieres)?p.matieres:[]; cache.notes=p.notes&&typeof p.notes==='object'?p.notes:{};
  cache.conseil=p.conseil&&typeof p.conseil==='object'?p.conseil:{}; cache.appels=p.appels&&typeof p.appels==='object'?p.appels:{}; markAllLoaded();
}
async function loadSchoolData(){

  var result = await supabase
    .from('notaschool_data')
    .select('payload')
    .eq('school_key', 'main')
    .maybeSingle();

  if(result.error) throw result.error;

  if(result.data){

    applyPayload(result.data.payload);

  } else {

    var initial = payloadFromCache();

    var ins = await supabase
      .from('notaschool_data')
      .insert({
        school_key: 'main',
        payload: initial
      });

    if(ins.error){

      if(ins.error.code !== '23505'){
        throw ins.error;
      }

      var again = await supabase
        .from('notaschool_data')
        .select('payload')
        .eq('school_key', 'main')
        .single();

      if(again.error) throw again.error;

      applyPayload(again.data.payload);

    } else {

      applyPayload(initial);

    }
  }

  revealShell();
}


function subscribeSchoolData(){

  if(syncChannel){
    supabase.removeChannel(syncChannel);
  }

  syncChannel = supabase
    .channel('notaschool-live')
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'notaschool_data',
        filter: 'school_key=eq.main'
      },
      function(msg){

        if(msg.new && msg.new.payload){

          applyPayload(msg.new.payload);

          flashSync('ok', 'Synchronisé');

          render();
        }

      }
    )
    .subscribe();
}

/* ================= viewer profile (role) ================= */
async function loadViewerProfile(){
  var res = await supabase.from('profiles').select('*').eq('id', viewer.id).maybeSingle();
  if(res.error) throw res.error;
  if(!res.data){
    await supabase.auth.signOut();
    throw new Error('Aucun profil associé à ce compte. Contactez un administrateur.');
  }
  if(!res.data.actif){
    await supabase.auth.signOut();
    throw new Error('Ce compte a été désactivé. Contactez un administrateur.');
  }
  viewerProfile = res.data;
}
function isAdmin(){ return !!(viewerProfile && viewerProfile.role === 'admin'); }
function isDirecteur(){ return !!(viewerProfile && viewerProfile.role === 'directeur'); }
function canManageUsers(){ return isAdmin() || isDirecteur(); }

/* ================= gestion des utilisateurs (admin) ================= */
function loadProfiles(){
  if(!canManageUsers()) return;
  supabase.from('profiles').select('*').order('identifiant').then(function(res){
    if(!res.error){ cache.profiles = res.data || []; if(ui.tab==='utilisateurs') render(); }
  });
}
async function callAdminApi(path, body){
  var sessionRes = await supabase.auth.getSession();
  var token = sessionRes.data && sessionRes.data.session && sessionRes.data.session.access_token;
  if(!token) throw new Error('Session expirée, reconnectez-vous.');
  var res = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body: JSON.stringify(body) });
  var json = {};
  try{ json = await res.json(); }catch(e){}
    if(!res.ok) throw new Error((json.error || ('Erreur serveur ('+res.status+')')) + (json.diag ? ' | DIAG: ' + JSON.stringify(json.diag) : ''));
  return json;
}

async function boot(){
  var form=document.getElementById('loginForm');
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){ showGateError('Configuration manquante : renseignez l’URL du projet et la clé anon/public dans supabase-config.js.'); return; }
  if(!window.supabase || !window.supabase.createClient){ showGateError('Impossible de charger la bibliothèque Supabase. Vérifiez votre connexion Internet.'); return; }
  supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

  supabase.auth.onAuthStateChange(async function(event, session) {

    if (event === 'SIGNED_OUT') {
        viewer = null;
        location.reload();
        return;
    }

    if (event === 'PASSWORD_RECOVERY') {

        var newPassword = prompt('Entrez votre nouveau mot de passe :');

        if (!newPassword) {
            return;
        }

        if (newPassword.length < 6) {
            alert('Le mot de passe doit contenir au moins 6 caractères.');
            return;
        }

        const { error } = await supabase.auth.updateUser({
            password: newPassword
        });

        if (error) {
            alert('Erreur : ' + error.message);
        } else {
            alert('Mot de passe modifié avec succès !');
            location.reload();
        }
    }
  });

  var sessionResult=await supabase.auth.getSession();
  if(sessionResult.error){ showGateError(sessionResult.error.message); return; }
  if(sessionResult.data.session){
    viewer=sessionResult.data.session.user;
    try{ await loadViewerProfile(); await loadSchoolData(); subscribeSchoolData(); }catch(e){ showGateError(e.message||String(e)); }
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault(); var btn=document.getElementById('loginButton'); btn.disabled=true; btn.textContent='Connexion…';
    var identifiant=document.getElementById('loginIdentifiant').value.trim(), password=document.getElementById('loginPassword').value;
    if(!identifiant){ showGateError('Entrez votre identifiant.'); btn.disabled=false; btn.textContent='Se connecter'; return; }
    var email=identifiantToEmail(identifiant);
    var auth=await supabase.auth.signInWithPassword({email:email,password:password});
    if(auth.error){ showGateError('Identifiant ou mot de passe incorrect.'); btn.disabled=false; btn.textContent='Se connecter'; return; }
    viewer=auth.data.user;
    try{ await loadViewerProfile(); await loadSchoolData(); subscribeSchoolData(); }catch(err){ showGateError(err.message||String(err)); btn.disabled=false; btn.textContent='Se connecter'; }
  });
}
function onCacheChange(){ flashSync('ok','Synchronisé'); render(); }
var syncFlashTimer=null;
function flashSync(state,label){
  var dot=document.getElementById('syncDot'),lbl=document.getElementById('syncLabel'); if(!dot||!lbl)return;
  dot.className='sync-dot'+(state==='busy'?' busy':state==='off'?' off':''); lbl.textContent=label;
  clearTimeout(syncFlashTimer); if(state!=='busy') syncFlashTimer=setTimeout(function(){dot.className='sync-dot';lbl.textContent='Synchronisé';},1800);
}
function writeGuardOk(){ return !readOnlyForced && !!viewer; }
function handleWriteError(err){ flashSync('off','Erreur de synchronisation'); console.error('Supabase write error:',err); alert('Enregistrement impossible : '+(err&&err.message?err.message:'vérifiez les droits Supabase et votre connexion.')); }
function persistPayload(){
  if(!supabase || !viewer) return Promise.reject(new Error('Utilisateur non connecté'));
  var payload=payloadFromCache(); flashSync('busy','Enregistrement…');
  saveQueue=saveQueue.then(async function(){
    var res=await supabase.from('notaschool_data').upsert({school_key:'main',payload:payload,updated_at:new Date().toISOString()},{onConflict:'school_key'});
    if(res.error) throw res.error; flashSync('ok','Synchronisé');
  }).catch(function(err){handleWriteError(err);});
  return saveQueue;
}
function dbSet(path,id,data){
  if(path==='config/ecole'){cache.school=data;return persistPayload();}
  var target=cache[path]; if(Array.isArray(target)){var i=target.findIndex(function(x){return x.id===id;});var row=Object.assign({id:id},data);if(i>=0)target[i]=row;else target.push(row);}
  else if(target && typeof target==='object') target[id]=data;
  return persistPayload();
}
function dbUpdate(path,id,patch){
  var target=cache[path]; if(Array.isArray(target)){var row=target.find(function(x){return x.id===id;});if(row)Object.assign(row,patch);}
  else if(target && target[id]) Object.assign(target[id],patch);
  return persistPayload();
}
function dbDelete(path,id){
  var target=cache[path]; if(Array.isArray(target)) cache[path]=target.filter(function(x){return x.id!==id;});
  else if(target && typeof target==='object') delete target[id];
  return persistPayload();
}
function dbSetDoc(path,data){ if(path==='config/ecole') cache.school=data; return persistPayload(); }

/* ================= domain helpers (read from cache) ================= */
function clasesTriees(){ return cache.classes.slice().sort(function(a,b){ return (a.nom||'').localeCompare(b.nom||'','fr'); }); }
function elevesDe(classeId){ return cache.eleves.filter(function(e){ return e.classeId===classeId; }).sort(function(a,b){ return ((a.nom||'')+(a.prenom||'')).localeCompare((b.nom||'')+(b.prenom||''),'fr'); }); }
function matieresDe(classeId){ return cache.matieres.filter(function(m){ return m.classeId===classeId; }).sort(function(a,b){ return (a.nom||'').localeCompare(b.nom||'','fr'); }); }

function noteKey(eleveId, matiereId, trimestre){ return eleveId+"_"+matiereId+"_"+trimestre; }
function getNoteEntry(eleveId, matiereId, trimestre){ return cache.notes[noteKey(eleveId,matiereId,trimestre)] || { valeurs:[], appreciation:"" }; }
function setNoteEntry(eleveId, matiereId, trimestre, patch){
  if(!writeGuardOk()) return;
  var key = noteKey(eleveId, matiereId, trimestre);
  var cur = cache.notes[key] || { valeurs:[], appreciation:"" };
  var merged = Object.assign({}, cur, patch, { eleveId:eleveId, matiereId:matiereId, trimestre:trimestre, updatedAt: Date.now(), updatedBy: viewer && viewer.id || null });
  cache.notes[key] = merged;
  render();
  dbSet("notes", key, merged);
}

function conseilKey(eleveId, trimestre){ return eleveId+"_"+trimestre; }
var CONSEIL_DEFAULT = { absences:"0 heure(s)", appreciationGlobale:"", date:"", conduite:"", absencesAnnuelles:"0 heure(s)", decision:"" };
function getConseil(eleveId, trimestre){ return Object.assign({}, CONSEIL_DEFAULT, cache.conseil[conseilKey(eleveId,trimestre)] || {}); }
function setConseil(eleveId, trimestre, patch){
  if(!writeGuardOk()) return;
  var key = conseilKey(eleveId, trimestre);
  var cur = Object.assign({}, CONSEIL_DEFAULT, cache.conseil[key] || {});
  var merged = Object.assign({}, cur, patch, { eleveId:eleveId, trimestre:trimestre, updatedAt: Date.now(), updatedBy: viewer && viewer.id || null });
  cache.conseil[key] = merged;
  dbSet("conseil", key, merged);
}

/* ================= appels / absences enrichis ================= */
var ABSENCE_MOTIFS = { maladie:"Maladie", autorisation:"Autorisation parentale", autre:"Autre" };
var JUSTIF_STATUTS = { en_attente:"En attente", valide:"Validé", refuse:"Refusé" };
function appelKey(date, classeId, eleveId){ return date+"_"+classeId+"_"+eleveId; }
function getAppel(date, classeId, eleveId){
  var a = cache.appels[appelKey(date,classeId,eleveId)];
  if(!a) return { date:date, classeId:classeId, eleveId:eleveId, statut:'present', periode:'journee', justifiee:false, motif:'', observation:'', piece:null, justificatifStatut:'en_attente' };
  var statutBrut = a.statut || 'present';
  return {
    date: a.date||date, classeId: a.classeId||classeId, eleveId: a.eleveId||eleveId,
    statut: statutBrut==='justifie' ? 'absent' : statutBrut,
    periode: a.periode || 'journee',
    justifiee: statutBrut==='justifie' ? true : !!a.justifiee,
    motif: a.motif || '',
    observation: a.observation || '',
    piece: a.piece || null,
    justificatifStatut: a.justificatifStatut || 'en_attente'
  };
}
function setAppel(date, classeId, eleveId, patch){
  if(!writeGuardOk()) return;
  var cur = getAppel(date, classeId, eleveId);
  var merged = Object.assign({}, cur, patch, { date:date, classeId:classeId, eleveId:eleveId, anneeScolaire: (cache.school&&cache.school.anneeScolaire)||'' });
  cache.appels[appelKey(date,classeId,eleveId)] = merged;
  dbSet("appels", appelKey(date,classeId,eleveId), merged);
}
function joursDePeriode(periode){ return periode==='journee' ? 1 : 0.5; }
function fmtJours(n){ n = Math.round(n*2)/2; var txt = (n===Math.floor(n)) ? String(n) : n.toFixed(1); return txt+' j'; }
/* Liste des absences d'un élève (toutes classes confondues), filtrée par trimestre si fourni. */
function absencesEleve(eleveId, trimestre){
  var out = [];
  Object.keys(cache.appels).forEach(function(key){
    var raw = cache.appels[key];
    if(!raw || raw.eleveId!==eleveId) return;
    var statutBrut = raw.statut || 'present';
    if(statutBrut!=='absent' && statutBrut!=='justifie') return;
    var tri = trimestreFromDate(raw.date);
    if(trimestre && tri!==trimestre) return;
    out.push(Object.assign({ trimestre:tri }, getAppel(raw.date, raw.classeId, raw.eleveId)));
  });
  out.sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
  return out;
}
function calcAbsencesEleve(eleveId, trimestre){
  var liste = absencesEleve(eleveId, trimestre);
  var justifiees=0, nonJustifiees=0;
  liste.forEach(function(a){ var j=joursDePeriode(a.periode); if(a.justifiee) justifiees+=j; else nonJustifiees+=j; });
  return { justifiees:justifiees, nonJustifiees:nonJustifiees, total:justifiees+nonJustifiees, liste:liste };
}

function moyenne(valeurs){ if(!valeurs || valeurs.length===0) return null; var propres=valeurs.filter(function(v){return v!==null && v!=='' && typeof v==='number' && !isNaN(v);}); if(!propres.length)return null; var sum=propres.reduce(function(a,b){return a+b;},0); return sum/propres.length; }
function round2(n){ return Math.round(n*100)/100; }
function fmt(n){ return n==null ? "—" : round2(n).toFixed(2); }

function suggestAppreciation(m){
  if(m==null) return "";
  if(m>=18) return "Excellent travail, félicitations";
  if(m>=16) return "Résultats très satisfaisants, encouragements";
  if(m>=14) return "Résultats satisfaisants";
  if(m>=12) return "Résultats assez satisfaisants";
  if(m>=10) return "Résultats passables, peut mieux faire";
  return "Résultats insuffisants, doit fournir davantage d'efforts";
}
function appreciationTone(m){ if(m==null) return "muted"; if(m>=16) return "good"; if(m>=10) return "gold"; return "warn"; }

function computeRanks(items){
  var withVal = items.filter(function(x){ return x.value!=null; }).slice().sort(function(a,b){ return b.value-a.value; });
  var ranks = {}, prevVal=null, rank=0, seen=0;
  withVal.forEach(function(v){ seen++; if(v.value!==prevVal){ rank=seen; prevVal=v.value; } ranks[v.id]=rank; });
  items.forEach(function(x){ if(x.value==null) ranks[x.id]=null; });
  return ranks;
}
function ordinal(n){ return n===1 ? "1er" : n+"e"; }

function statsMatiere(classeId, matiereId, trimestre){
  var eleves = elevesDe(classeId);
  var moyennes = {};
  eleves.forEach(function(e){ moyennes[e.id] = moyenne(getNoteEntry(e.id, matiereId, trimestre).valeurs); });
  var valides = eleves.map(function(e){ return moyennes[e.id]; }).filter(function(v){ return v!=null; });
  var moyClasse = valides.length ? valides.reduce(function(a,b){return a+b;},0)/valides.length : null;
  var ranks = computeRanks(eleves.map(function(e){ return {id:e.id, value:moyennes[e.id]}; }));
  return { moyennes:moyennes, moyenneClasse:moyClasse, ranks:ranks };
}
function statsGenerale(classeId, trimestre){
  var eleves = elevesDe(classeId), mats = matieresDe(classeId);
  var generales = {};
  eleves.forEach(function(e){
    var vals = [];
    mats.forEach(function(m){ var moy = moyenne(getNoteEntry(e.id, m.id, trimestre).valeurs); if(moy!=null) vals.push(moy); });
    generales[e.id] = vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
  });
  var valides = eleves.map(function(e){ return generales[e.id]; }).filter(function(v){ return v!=null; });
  var moyClasseGen = valides.length ? valides.reduce(function(a,b){return a+b;},0)/valides.length : null;
  var ranks = computeRanks(eleves.map(function(e){ return {id:e.id, value:generales[e.id]}; }));
  return { generales:generales, moyenneClasse:moyClasseGen, ranks:ranks };
}
/* Bilan annuel (Trimestre 3 uniquement) : moyenne de la moyenne générale des 3 trimestres,
   calculée uniquement à partir des trimestres où l'élève a des notes. */
function statsAnnuelle(classeId){
  var eleves = elevesDe(classeId);
  var g1 = statsGenerale(classeId,1).generales;
  var g2 = statsGenerale(classeId,2).generales;
  var g3 = statsGenerale(classeId,3).generales;
  var annuelles = {};
  eleves.forEach(function(e){
    var vals = [g1[e.id], g2[e.id], g3[e.id]].filter(function(v){ return v!=null; });
    annuelles[e.id] = vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
  });
  var valides = eleves.map(function(e){ return annuelles[e.id]; }).filter(function(v){ return v!=null; });
  var moyClasseAnnuelle = valides.length ? valides.reduce(function(a,b){return a+b;},0)/valides.length : null;
  var ranks = computeRanks(eleves.map(function(e){ return {id:e.id, value:annuelles[e.id]}; }));
  return { t1:g1, t2:g2, t3:g3, annuelles:annuelles, moyenneClasse:moyClasseAnnuelle, ranks:ranks };
}

/* ================= images ================= */
function resizeImage(file, maxW, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, maxW/img.width);
      var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      var canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      var ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      try{ cb(canvas.toDataURL('image/jpeg',0.78)); }catch(e){ cb(""); }
    };
    img.onerror = function(){ cb(""); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(""); };
  reader.readAsDataURL(file);
}
/* Pièce jointe de justificatif : image (compressée) ou PDF (taille limitée). */
function filePieceToDataUrl(file, cb){
  var MAX_BYTES = 1500000;
  if(!file){ cb(null); return; }
  if(file.size > MAX_BYTES){ alert('Fichier trop volumineux (max 1,5 Mo). Choisissez une photo plus légère ou un PDF compressé.'); cb(null); return; }
  if(/^image\//.test(file.type)){
    resizeImage(file, 1000, function(dataUrl){ cb(dataUrl ? {name:file.name, type:'image', dataUrl:dataUrl} : null); });
  } else if(file.type==='application/pdf'){
    var reader = new FileReader();
    reader.onload = function(){ cb({name:file.name, type:'pdf', dataUrl:reader.result}); };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  } else {
    alert('Format non supporté. Utilisez une image (JPG/PNG) ou un PDF.');
    cb(null);
  }
}

/* ================= render: content dispatch ================= */
function renderContent(){
  var el = document.getElementById('content');
  switch(ui.tab){
    case 'etablissement': el.innerHTML = readOnlyBanner() + viewEtablissement(); break;
    case 'classes': el.innerHTML = readOnlyBanner() + viewClasses(); break;
    case 'eleves': el.innerHTML = readOnlyBanner() + viewEleves(); break;
    case 'matieres': el.innerHTML = readOnlyBanner() + viewMatieres(); break;

    case 'appels': el.innerHTML = readOnlyBanner() + viewAppels(); break;

  var dis = writeGuardOk() ? '' : ' disabled';

  var classeOpts = classes.map(function(c){ return '<option value="'+c.id+'"'+(c.id===classeId?' selected':'')+'>'+esc(c.nom)+'</option>'; }).join('');
  var mats = classeId ? matieresDe(classeId) : [];
  var matiereId = ui.notesMatiere && mats.some(function(m){return m.id===ui.notesMatiere;}) ? ui.notesMatiere : (mats[0] ? mats[0].id : "");
  var matOpts = mats.map(function(m){ return '<option value="'+m.id+'"'+(m.id===matiereId?' selected':'')+'>'+esc(m.nom)+'</option>'; }).join('');
  var eleves = classeId ? elevesDe(classeId) : [];
  var tri = ui.trimestre;

  var rows = "";
  if(matiereId){
    var st = statsMatiere(classeId, matiereId, tri);

      var entry = getNoteEntry(e.id, matiereId, tri);

        + '<td class="tabnum" style="text-align:center">'+fmt(moy)+'</td>'

        + '<td><input type="text" data-note-eleve="'+e.id+'" data-note-field="appreciation" value="'+esc(entry.appreciation)+'" placeholder="'+esc(suggestAppreciation(moy)||'Appréciation')+'"'+dis+'></td>'
      + '</tr>';
    }).join('');
  }

  return ''
  + '<div class="view-head"><div><h1>Notes — Trimestre '+tri+'</h1><p>Saisissez les quatre devoirs sur 20. La moyenne est calculée automatiquement sur les devoirs renseignés et les résultats sont synchronisés.</p></div></div>'
  + '<div class="panel">'
    + '<div class="field-grid">'
      + '<div class="field"><label>Classe</label><select id="notesClasse">'+classeOpts+'</select></div>'

/* ================= view: liste d'appel ================= */

  var date=ui.dateAppel||todayISO();

  var rows=eleves.map(function(e){

      pieceCell = '<input type="file" accept="image/*,application/pdf" data-appel-piece="'+e.id+'"'+dis+'>';
      if(a.piece) pieceCell += '<div class="hint" style="margin-top:4px"><a href="'+a.piece.dataUrl+'" target="_blank" rel="noopener">'+esc(a.piece.name||'Fichier joint')+'</a></div>';

    if(isAbsent){
      justifCell = canValidate

        : esc(JUSTIF_STATUTS[a.justificatifStatut]||'En attente');

      + '<td>'+esc(e.nom)+'</td><td>'+esc(e.prenom)+'</td>'
      + '<td><select data-appel-statut="'+e.id+'"'+dis+'><option value="present"'+(a.statut==='present'?' selected':'')+'>Présent</option><option value="absent"'+(isAbsent?' selected':'')+'>Absent</option><option value="retard"'+(a.statut==='retard'?' selected':'')+'>Retard</option></select></td>'
      + '<td>'+(isAbsent ? '<select data-appel-periode="'+e.id+'"'+dis+'><option value="journee"'+(a.periode==='journee'?' selected':'')+'>Journée</option><option value="matin"'+(a.periode==='matin'?' selected':'')+'>Matin</option><option value="apresmidi"'+(a.periode==='apresmidi'?' selected':'')+'>Après-midi</option></select>' : '—')+'</td>'

/* Tableau de bord des absences : filtres élève / classe / dates / trimestre / justification. */
function renderTableauBordAbsences(){
  var classes = clasesTriees();
  var classeOpts = '<option value="">Toutes les classes</option>'+classes.map(function(c){return '<option value="'+c.id+'"'+(ui.absDashClasse===c.id?' selected':'')+'>'+esc(c.nom)+'</option>';}).join('');
  var elevesDisponibles = (ui.absDashClasse ? elevesDe(ui.absDashClasse) : cache.eleves.slice()).sort(function(a,b){ return ((a.nom||'')+(a.prenom||'')).localeCompare((b.nom||'')+(b.prenom||''),'fr'); });
  var eleveOpts = '<option value="">Tous les élèves</option>'+elevesDisponibles.map(function(e){return '<option value="'+e.id+'"'+(ui.absDashEleve===e.id?' selected':'')+'>'+esc(e.nom)+' '+esc(e.prenom)+'</option>';}).join('');

  var toutes = [];
  Object.keys(cache.appels).forEach(function(key){
    var raw = cache.appels[key];
    if(!raw) return;
    var statutBrut = raw.statut || 'present';
    if(statutBrut!=='absent' && statutBrut!=='justifie') return;
    var a = getAppel(raw.date, raw.classeId, raw.eleveId);
    var e = cache.eleves.find(function(x){ return x.id===a.eleveId; });
    var c = cache.classes.find(function(x){ return x.id===a.classeId; });
    toutes.push(Object.assign({}, a, { trimestre: trimestreFromDate(a.date), eleveNom: e?(e.nom+' '+e.prenom):'—', classeNom: c?c.nom:'—' }));
  });

  var filtrees = toutes.filter(function(a){
    if(ui.absDashEleve && a.eleveId!==ui.absDashEleve) return false;
    if(ui.absDashClasse && a.classeId!==ui.absDashClasse) return false;
    if(ui.absDashDateDebut && a.date < ui.absDashDateDebut) return false;
    if(ui.absDashDateFin && a.date > ui.absDashDateFin) return false;
    if(ui.absDashTrimestre && String(a.trimestre)!==String(ui.absDashTrimestre)) return false;
    if(ui.absDashJustifiee==='justifiees' && !a.justifiee) return false;
    if(ui.absDashJustifiee==='non_justifiees' && a.justifiee) return false;
    return true;
  }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

  var totalJ=0, totalNJ=0;
  filtrees.forEach(function(a){ var j=joursDePeriode(a.periode); if(a.justifiee) totalJ+=j; else totalNJ+=j; });

  var rows = filtrees.map(function(a){
    var pieceLink = a.piece ? '<a href="'+a.piece.dataUrl+'" target="_blank" rel="noopener">'+esc(a.piece.name||'Voir')+'</a>' : '—';
    return '<tr>'
      + '<td>'+esc(frDate(a.date))+'</td>'
      + '<td>'+esc(a.classeNom)+'</td>'
      + '<td>'+esc(a.eleveNom)+'</td>'
      + '<td>'+(a.trimestre?('Trim. '+a.trimestre):'—')+'</td>'
      + '<td>'+({journee:'Journée',matin:'Matin',apresmidi:'Après-midi'}[a.periode]||a.periode)+'</td>'
      + '<td>'+(a.justifiee ? '<span class="pill pill-good">Justifiée</span>' : '<span class="pill pill-muted">Non justifiée</span>')+'</td>'
      + '<td>'+esc(ABSENCE_MOTIFS[a.motif]||'—')+'</td>'
      + '<td>'+esc(a.observation||'—')+'</td>'
      + '<td>'+pieceLink+'</td>'
      + '<td>'+esc(JUSTIF_STATUTS[a.justificatifStatut]||'En attente')+'</td>'
    + '</tr>';
  }).join('');

  return ''
  + '<div class="panel"><div class="field-grid">'
    + '<div class="field"><label>Élève</label><select id="absDashEleve">'+eleveOpts+'</select></div>'
    + '<div class="field"><label>Classe</label><select id="absDashClasse">'+classeOpts+'</select></div>'
    + '<div class="field"><label>Du</label><input type="date" id="absDashDateDebut" value="'+esc(ui.absDashDateDebut)+'"></div>'
    + '<div class="field"><label>Au</label><input type="date" id="absDashDateFin" value="'+esc(ui.absDashDateFin)+'"></div>'
    + '<div class="field"><label>Trimestre</label><select id="absDashTrimestre"><option value="">Tous</option><option value="1"'+(ui.absDashTrimestre==='1'?' selected':'')+'>Trimestre 1</option><option value="2"'+(ui.absDashTrimestre==='2'?' selected':'')+'>Trimestre 2</option><option value="3"'+(ui.absDashTrimestre==='3'?' selected':'')+'>Trimestre 3</option></select></div>'
    + '<div class="field"><label>Justification</label><select id="absDashJustifiee"><option value="">Toutes</option><option value="justifiees"'+(ui.absDashJustifiee==='justifiees'?' selected':'')+'>Justifiées</option><option value="non_justifiees"'+(ui.absDashJustifiee==='non_justifiees'?' selected':'')+'>Non justifiées</option></select></div>'
  + '</div></div>'
  + '<div class="panel"><h2>Résultats <span class="count">'+filtrees.length+'</span></h2>'
    + '<p class="hint" style="margin-top:0">Total : '+fmtJours(totalJ+totalNJ)+' — '+fmtJours(totalJ)+' justifié(s), '+fmtJours(totalNJ)+' non justifié(s).</p>'
    + (filtrees.length
      ? '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Classe</th><th>Élève</th><th>Trimestre</th><th>Période</th><th>Justification</th><th>Motif</th><th>Observation</th><th>Justificatif</th><th>Statut</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      : '<div class="empty">Aucune absence pour ces filtres.</div>')
  + '</div>';
}

        + '<div class="date">Le '+esc(frDate(dateBulletin))+'</div>'
        + '<div class="field" style="margin-top:6px; display:none"><input type="date" data-sheet-date="'+e.id+'" value="'+esc(dateBulletin)+'" style="font-size:11.5px; padding:4px 6px"'+dis+'></div>'
      + '</div>'
    + '</div>'
    + '<div class="sheet-id">'
      + '<dl>'

/* Bloc "Bilan annuel", affiché uniquement sur le bulletin du Trimestre 3.
   Reprend le modèle papier : absences, récap des 3 trimestres, moyenne générale annuelle. */
function renderBilanAnnuel(e, conseilT3, annStats, absTri){
  var moyAnnuelle = annStats.annuelles[e.id];
  var rangAnnuel = annStats.ranks[e.id];
  var t1 = annStats.t1[e.id], t2 = annStats.t2[e.id], t3 = annStats.t3[e.id];
  var absAnnuelle = calcAbsencesEleve(e.id, null);
  var absAnnuelleTexte = absAnnuelle.total>0 ? (fmtJours(absAnnuelle.total)+' — '+fmtJours(absAnnuelle.justifiees)+' justifié(s), '+fmtJours(absAnnuelle.nonJustifiees)+' non justifié(s)') : '0 j';
  return ''
  + '<div class="bilan-annuel">'
    + '<div class="table-wrap"><table><tbody>'
      + '<tr><td>Absences Trimestre 3</td><td class="num tabnum">'+esc(fmtJours(absTri.total))+'</td></tr>'
      + '<tr><td>Absences Annuelle</td><td class="num tabnum">'+esc(absAnnuelleTexte)+'</td></tr>'
      + '<tr><td>Position de l\'élève</td><td class="num tabnum">'+(rangAnnuel?ordinal(rangAnnuel):'—')+'</td></tr>'
    + '</tbody></table></div>'
    + '<div class="table-wrap"><table><tbody>'
      + '<tr><td>Moyenne Trimestre 1</td><td class="num tabnum">'+fmt(t1)+'</td></tr>'
      + '<tr><td>Moyenne Trimestre 2</td><td class="num tabnum">'+fmt(t2)+'</td></tr>'
      + '<tr><td>Moyenne Trimestre 3</td><td class="num tabnum">'+fmt(t3)+'</td></tr>'
    + '</tbody></table></div>'
    + '<div class="table-wrap"><table><tbody>'
      + '<tr><td>Moyenne Générale Annuelle</td><td class="num tabnum">'+fmt(moyAnnuelle)+'</td></tr>'
    + '</tbody></table></div>'
  + '</div>';
}

/* ================= view: utilisateurs (admin) ================= */
function viewUtilisateurs(){
  var creatableRoles = isAdmin() ? Object.keys(ROLES_LABELS) : ['enseignant','secretaire'];
  var roleOpts = creatableRoles.map(function(r){ return '<option value="'+r+'">'+ROLES_LABELS[r]+'</option>'; }).join('');
  var liste = (cache.profiles||[]).slice().sort(function(a,b){ return (a.identifiant||'').localeCompare(b.identifiant||'','fr'); });
  if(!isAdmin()){
    liste = liste.filter(function(p){ return p.role==='enseignant' || p.role==='secretaire'; });
  }

  var rows = liste.map(function(p){
    var isSelf = viewer && p.id===viewer.id;
    var roleEditable = isAdmin() && !isSelf;
    var roleSelect = roleEditable
      ? Object.keys(ROLES_LABELS).map(function(r){ return '<option value="'+r+'"'+(r===p.role?' selected':'')+'>'+ROLES_LABELS[r]+'</option>'; }).join('')
      : '';
    return '<tr>'
      + '<td class="mono">'+esc(p.identifiant)+(isSelf?' <span class="pill pill-gold">Vous</span>':'')+'</td>'
      + '<td><input type="text" data-profil-nom="'+p.id+'" value="'+esc(p.full_name||'')+'" placeholder="Nom complet (optionnel)"></td>'
      + '<td>'+(roleEditable ? '<select data-profil-role="'+p.id+'">'+roleSelect+'</select>' : '<span class="pill">'+esc(ROLES_LABELS[p.role]||p.role)+'</span>')+'</td>'
      + '<td>'+(p.actif ? '<span class="pill pill-good">Actif</span>' : '<span class="pill pill-muted">Désactivé</span>')+'</td>'
      + '<td class="row">'
        + '<button type="button" class="btn btn-sm" data-action="reset-password" data-id="'+p.id+'" data-identifiant="'+esc(p.identifiant)+'">Réinitialiser le mot de passe</button>'
        + (isSelf ? '' : '<button type="button" class="btn btn-sm '+(p.actif?'btn-danger':'')+'" data-action="toggle-actif" data-id="'+p.id+'" data-actif="'+(p.actif?'1':'0')+'">'+(p.actif?'Désactiver':'Activer')+'</button>')
      + '</td>'
    + '</tr>';
  }).join('');

  return ''
  + '<div class="view-head"><div><h1>Utilisateurs</h1><p>'+(isAdmin() ? 'Créez un compte pour chaque enseignant, secrétaire ou directeur, avec un identifiant et un mot de passe temporaire.' : 'Créez un compte pour chaque enseignant ou secrétaire, avec un identifiant et un mot de passe temporaire.')+' L’identifiant sert à se connecter, sans adresse e-mail.</p></div></div>'
  + '<div class="panel">'
    + '<h2>Nouvel utilisateur</h2>'
    + '<div class="field-grid">'
      + '<div class="field"><label>Identifiant</label><input type="text" id="newUserIdentifiant" placeholder="Ex. prof_math, secretaire1"></div>'
      + '<div class="field"><label>Mot de passe temporaire</label><input type="text" id="newUserPassword" placeholder="6 caractères minimum"></div>'
      + '<div class="field"><label>Rôle</label><select id="newUserRole">'+roleOpts+'</select></div>'
      + '<div class="field"><label>Nom complet (optionnel)</label><input type="text" id="newUserNom" placeholder="Ex. Awaleh Hassan"></div>'
    + '</div>'
    + '<div class="row" style="margin-top:12px"><button type="button" class="btn btn-primary" data-action="add-utilisateur">Créer le compte</button></div>'
    + '<div class="hint" id="newUserHint"></div>'
  + '</div>'
  + '<div class="panel">'
    + '<h2>Comptes <span class="count">'+liste.length+'</span></h2>'
    + (liste.length
      ? '<div class="table-wrap"><table><thead><tr><th>Identifiant</th><th>Nom complet</th><th>Rôle</th><th>Statut</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      : '<div class="empty">Chargement, ou aucun utilisateur pour l’instant.</div>')
  + '</div>';
}

/* ================= events ================= */
function setPath(obj, path, value){ var parts = path.split('.'); var o = obj; for(var i=0;i<parts.length-1;i++){ o = o[parts[i]]; } o[parts[parts.length-1]] = value; }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action], [data-tab], [data-term]');
  if(!t) return;

  if(t.dataset.tab){ ui.tab = t.dataset.tab; saveUi(); render(); if(t.dataset.tab==='utilisateurs') loadProfiles(); return; }
  if(t.dataset.term){ ui.trimestre = parseInt(t.dataset.term,10); saveUi(); render(); return; }

  var action = t.dataset.action;
  if(!action) return;
  if(!writeGuardOk() && action !== 'copy-backup') return;

  if(action === 'logout'){ supabase.auth.signOut(); return; }
  if(action === 'remove-logo'){ cache.school.logo=""; render(); dbSetDoc("config/ecole", cache.school); }
  else if(action === 'copy-backup'){
    var box = document.getElementById('backupBox'); box.select();
    navigator.clipboard && navigator.clipboard.writeText(box.value).catch(function(){ try{ document.execCommand('copy'); }catch(err){} });
  }
  else if(action === 'add-classe'){
    var nomEl = document.getElementById('newClasseNom'), profEl = document.getElementById('newClasseProf');
    if(nomEl.value.trim()){
      var id = uid();
      var obj = { nom:nomEl.value.trim(), professeurPrincipal:profEl.value.trim() };
      cache.classes.push(Object.assign({id:id}, obj));
      ui.classeFiltre = id; saveUi(); render();
      dbSet("classes", id, obj);
    }
  }
  else if(action === 'add-eleve'){
    var nEl=document.getElementById('newEleveNom'), pEl=document.getElementById('newElevePrenom'),
        cEl=document.getElementById('newEleveClasse'), dEl=document.getElementById('newEleveDate'),
        sxEl=document.getElementById('newEleveSexe'), mEl=document.getElementById('newEleveMatricule');
    if(nEl.value.trim() && cEl.value){
      var eid = uid();
      var obj = { classeId:cEl.value, nom:nEl.value.trim(), prenom:(pEl.value||'').trim(), sexe:sxEl?sxEl.value:'', dateNaissance:dEl.value||'', matricule:(mEl.value||'').trim() || ('EL-'+Math.floor(1000+Math.random()*9000)), photo:'' };
      cache.eleves.push(Object.assign({id:eid}, obj));
      render();
      dbSet("eleves", eid, obj);
    }
  }
  else if(action === 'add-matiere'){
    var cmEl=document.getElementById('newMatiereClasse'), nmEl=document.getElementById('newMatiereNom'), emEl=document.getElementById('newMatiereEns');
    if(cmEl.value && nmEl.value.trim()){
      var mid = uid();
      var obj = { classeId:cmEl.value, nom:nmEl.value.trim(), enseignant:(emEl.value||'').trim() };
      cache.matieres.push(Object.assign({id:mid}, obj));
      render();
      dbSet("matieres", mid, obj);
    }
  }
  else if(action === 'delete-arm'){ ui.deleteArmed = t.dataset.kind+':'+t.dataset.id; render(); }
  else if(action === 'delete-cancel'){ ui.deleteArmed = ''; render(); }
  else if(action === 'delete-confirm'){
    var kind=t.dataset.kind, id=t.dataset.id;
    if(kind==='classe'){
      var orphanEleves = cache.eleves.filter(function(e){return e.classeId===id;});
      var orphanMats = cache.matieres.filter(function(m){return m.classeId===id;});
      cache.classes = cache.classes.filter(function(c){return c.id!==id;});
      cache.eleves = cache.eleves.filter(function(e){return e.classeId!==id;});
      cache.matieres = cache.matieres.filter(function(m){return m.classeId!==id;});
      if(ui.classeFiltre===id) ui.classeFiltre = '';
      ui.deleteArmed = ''; saveUi(); render();
      dbDelete("classes", id);
      orphanEleves.forEach(function(e){ dbDelete("eleves", e.id); });
      orphanMats.forEach(function(m){ dbDelete("matieres", m.id); });
    } else if(kind==='eleve'){
      cache.eleves = cache.eleves.filter(function(e){return e.id!==id;});
      ui.deleteArmed=''; render();
      dbDelete("eleves", id);
    } else if(kind==='matiere'){
      cache.matieres = cache.matieres.filter(function(m){return m.id!==id;});
      ui.deleteArmed=''; render();
      dbDelete("matieres", id);
    }
  }
  else if(action === 'add-utilisateur'){
    if(!canManageUsers()) return;
    var idEl=document.getElementById('newUserIdentifiant'), pwEl=document.getElementById('newUserPassword'),
        rEl=document.getElementById('newUserRole'), nEl2=document.getElementById('newUserNom'),
        hintEl=document.getElementById('newUserHint'), btn=t;
    var identifiant=(idEl.value||'').trim(), password=pwEl.value||'', role=rEl.value, nomComplet=(nEl2.value||'').trim();
    if(!identifiant || !password){ hintEl.textContent='Identifiant et mot de passe sont requis.'; return; }
    btn.disabled=true; hintEl.textContent='Création en cours…';
    callAdminApi('/api/admin-create-user', {identifiant:identifiant, password:password, role:role, nomComplet:nomComplet})
      .then(function(){
        hintEl.textContent='Compte « '+identifiant+' » créé.';
        idEl.value=''; pwEl.value=''; nEl2.value='';
        loadProfiles();
      })
      .catch(function(err){ hintEl.textContent='Erreur : '+(err.message||err); })
      .finally(function(){ btn.disabled=false; });
  }
  else if(action === 'reset-password'){
    if(!canManageUsers()) return;
    var uidTarget=t.dataset.id, identifiantTarget=t.dataset.identifiant;
    var nouveau = prompt('Nouveau mot de passe temporaire pour « '+identifiantTarget+' » (6 caractères minimum) :');
    if(!nouveau) return;
    if(nouveau.length<6){ alert('Le mot de passe doit contenir au moins 6 caractères.'); return; }
    callAdminApi('/api/admin-update-user', {userId:uidTarget, password:nouveau})
      .then(function(){ alert('Mot de passe réinitialisé pour « '+identifiantTarget+' ».'); })
      .catch(function(err){ alert('Erreur : '+(err.message||err)); });
  }
  else if(action === 'toggle-actif'){
    if(!canManageUsers()) return;
    var uidTarget2=t.dataset.id, actifActuel=t.dataset.actif==='1';
    var confirmMsg = actifActuel ? 'Désactiver ce compte ? La personne ne pourra plus se connecter.' : 'Réactiver ce compte ?';
    if(!confirm(confirmMsg)) return;
    callAdminApi('/api/admin-update-user', {userId:uidTarget2, actif: !actifActuel})
      .then(function(){ loadProfiles(); })
      .catch(function(err){ alert('Erreur : '+(err.message||err)); });
  }
  else if(action === 'appel-tout-present'){
    var classeTP=t.dataset.classe, dateTP=t.dataset.date;
    elevesDe(classeTP).forEach(function(el){ setAppel(dateTP, classeTP, el.id, {statut:'present', periode:'journee', justifiee:false, motif:'', observation:''}); });
    appelSelection = {}; render();
  }
  else if(action === 'appel-selection-absente'){
    var classeSA=t.dataset.classe, dateSA=t.dataset.date;
    var ids = Object.keys(appelSelection).filter(function(id){ return appelSelection[id]; });
    if(!ids.length){ alert('Cochez d’abord les élèves à marquer absents.'); return; }
    ids.forEach(function(id){ setAppel(dateSA, classeSA, id, {statut:'absent'}); });
    appelSelection = {}; render();
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(!writeGuardOk() && (t.dataset.path || t.dataset.classe || t.dataset.eleve || t.dataset.matiere || t.dataset.noteEleve || t.dataset.appelJour || t.dataset.conseilEleve || t.dataset.sheetDate || t.id==='logoInput' || t.hasAttribute('data-eleve-photo')
    || t.dataset.appelStatut || t.dataset.appelPeriode || t.dataset.appelJustifiee || t.dataset.appelMotif || t.dataset.appelObservation || t.dataset.appelPiece || t.dataset.appelJustifStatut)) return;

  if(t.id === 'importJsonInput' && t.files && t.files[0]){
    var reader = new FileReader();
    reader.onload = async function(){
      try{
        var imported = JSON.parse(String(reader.result||'{}'));
        if(!imported || typeof imported !== 'object' || !Array.isArray(imported.classes) || !Array.isArray(imported.eleves) || !Array.isArray(imported.matieres)) throw new Error('Structure JSON non reconnue.');
        if(!confirm('Confirmer l’import ? Les données actuellement présentes dans Supabase seront remplacées.')) return;
        cache.school = Object.assign({nom:'',telephone:'',email:'',anneeScolaire:'',logo:''}, imported.school||{});
        cache.classes = imported.classes; cache.eleves = imported.eleves; cache.matieres = imported.matieres;
        cache.notes = imported.notes && typeof imported.notes==='object' ? imported.notes : {};
        cache.conseil = imported.conseil && typeof imported.conseil==='object' ? imported.conseil : {};
        cache.appels = imported.appels && typeof imported.appels==='object' ? imported.appels : {};
        await persistPayload(); render(); alert('Import terminé : les données ont été envoyées vers Supabase.');
      }catch(err){ alert('Import impossible : '+(err.message||err)); }
      t.value='';
    };
    reader.readAsText(t.files[0], 'UTF-8'); return;
  }

  if(t.id === 'logoInput' && t.files && t.files[0]){
    resizeImage(t.files[0], 220, function(dataUrl){ cache.school.logo = dataUrl; render(); dbSetDoc("config/ecole", cache.school); });
    return;
  }
  if(t.hasAttribute('data-eleve-photo')){
    var eid = t.getAttribute('data-eleve-photo');
    if(t.files && t.files[0]){
      resizeImage(t.files[0], 220, function(dataUrl){
        var el = cache.eleves.find(function(x){return x.id===eid;});
        if(el){ el.photo = dataUrl; render(); dbUpdate("eleves", eid, {photo:dataUrl}); }
      });
    }
    return;
  }
  if(t.dataset.appelPiece){
    var eidPiece = t.dataset.appelPiece;
    if(t.files && t.files[0]){
      var classeP = ui.classeFiltre||(clasesTriees()[0]&&clasesTriees()[0].id)||'', dateP = ui.dateAppel||todayISO();
      filePieceToDataUrl(t.files[0], function(piece){
        if(piece){ setAppel(dateP, classeP, eidPiece, {piece:piece}); render(); }
        t.value='';
      });
    }
    return;
  }

  if(t.dataset.path){ setPath(cache, t.dataset.path, t.value); renderShell(); dbSetDoc("config/ecole", cache.school); return; }

  if(t.id === 'appelClasse'){ui.classeFiltre=t.value;saveUi();render();return;}
  if(t.id === 'appelDate'){ui.dateAppel=t.value;saveUi();render();return;}
  if(t.id === 'appelMode'){ui.appelMode=t.value;saveUi();render();return;}
  if(t.dataset.appelJour){ if(t.dataset.appelJour==='1') ui.appelJour1=t.value; else ui.appelJour2=t.value; saveUi(); render(); return; }
  if(t.id === 'absDashEleve'){ui.absDashEleve=t.value;saveUi();render();return;}
  if(t.id === 'absDashClasse'){ui.absDashClasse=t.value;ui.absDashEleve='';saveUi();render();return;}
  if(t.id === 'absDashDateDebut'){ui.absDashDateDebut=t.value;saveUi();render();return;}
  if(t.id === 'absDashDateFin'){ui.absDashDateFin=t.value;saveUi();render();return;}
  if(t.id === 'absDashTrimestre'){ui.absDashTrimestre=t.value;saveUi();render();return;}
  if(t.id === 'absDashJustifiee'){ui.absDashJustifiee=t.value;saveUi();render();return;}
  if(t.id === 'filtreClasseEleves' || t.id==='filtreClasseMatieres' || t.id==='notesClasse' || t.id==='bulletinClasse'){ ui.classeFiltre = t.value; saveUi(); render(); return; }
  if(t.id === 'notesMatiere'){ ui.notesMatiere = t.value; saveUi(); render(); return; }
  if(t.id === 'bulletinMode'){ ui.bulletinMode = t.value; saveUi(); render(); return; }
  if(t.id === 'bulletinEleve'){ ui.bulletinEleve = t.value; saveUi(); render(); return; }

  if(t.dataset.classe){
    var c = cache.classes.find(function(x){return x.id===t.dataset.classe;});
    if(c){ var patch={}; patch[t.dataset.field]=t.value; c[t.dataset.field]=t.value; renderShell(); dbUpdate("classes", c.id, patch); }
    return;
  }
  if(t.dataset.eleve){
    var el = cache.eleves.find(function(x){return x.id===t.dataset.eleve;});
    if(el){
      var patch2={}; patch2[t.dataset.field]=t.value; el[t.dataset.field]=t.value;
      if(t.dataset.field==='classeId') render(); else renderShell();
      dbUpdate("eleves", el.id, patch2);
    }
    return;
  }
  if(t.dataset.matiere){
    var m = cache.matieres.find(function(x){return x.id===t.dataset.matiere;});
    if(m){ var patch3={}; patch3[t.dataset.field]=t.value; m[t.dataset.field]=t.value; dbUpdate("matieres", m.id, patch3); }
    return;
  }

  if(t.dataset.noteEleve){
    var classeId = ui.classeFiltre;
    var matiereId = ui.notesMatiere || (matieresDe(classeId)[0] && matieresDe(classeId)[0].id);
    var tri = ui.trimestre;
    var eid2 = t.dataset.noteEleve, field = t.dataset.noteField;
    if(['dev1','dev2','dev3','dev4'].indexOf(field)>=0){
      var current=getNoteEntry(eid2,matiereId,tri), vals=(current.valeurs||[]).slice(0,4);
      var ix=parseInt(field.slice(3),10)-1; vals[ix]=t.value===''?null:parseFloat(t.value);
      while(vals.length<4) vals.push(null);
      setNoteEntry(eid2,matiereId,tri,{valeurs:vals});
    } else if(field==='valeurs'){
      var vals = t.value.split(',').map(function(s){ return parseFloat(s.trim().replace(',','.')); }).filter(function(n){ return !isNaN(n); });
      setNoteEntry(eid2, matiereId, tri, { valeurs: vals });
    } else {
      setNoteEntry(eid2, matiereId, tri, { appreciation: t.value });
    }
    return;
  }

  if(t.dataset.appelStatut){
    var classeS=ui.classeFiltre||(clasesTriees()[0]&&clasesTriees()[0].id)||'', dateS=ui.dateAppel||todayISO();
    var patchS = {statut:t.value};
    if(t.value!=='absent'){ patchS.periode='journee'; patchS.justifiee=false; patchS.motif=''; patchS.observation=''; }
    setAppel(dateS, classeS, t.dataset.appelStatut, patchS);
    render();
    return;
  }
  if(t.dataset.appelPeriode){var classePe=ui.classeFiltre||(clasesTriees()[0]&&clasesTriees()[0].id)||'', datePe=ui.dateAppel||todayISO(); setAppel(datePe, classePe, t.dataset.appelPeriode, {periode:t.value}); return;}
  if(t.dataset.appelJustifiee){var classeJ=ui.classeFiltre||(clasesTriees()[0]&&clasesTriees()[0].id)||'', dateJ=ui.dateAppel||todayISO(); setAppel(dateJ, classeJ, t.dataset.appelJustifiee, {justifiee:t.checked}); return;}
  if(t.dataset.appelMotif){var classeM=ui.classeFiltre||(clasesTriees()[0]&&clasesTriees()[0].id)||'', dateM=ui.dateAppel||todayISO(); setAppel(dateM, classeM, t.dataset.appelMotif, {motif:t.value}); return;}
  if(t.dataset.appelObservation){var classeO=ui.classeFiltre||(clasesTriees()[0]&&clasesTriees()[0].id)||'', dateO=ui.dateAppel||todayISO(); setAppel(dateO, classeO, t.dataset.appelObservation, {observation:t.value}); return;}
  if(t.dataset.appelJustifStatut){
    if(!canManageUsers()) return;
    var classeV=ui.classeFiltre||(clasesTriees()[0]&&clasesTriees()[0].id)||'', dateV=ui.dateAppel||todayISO();
    setAppel(dateV, classeV, t.dataset.appelJustifStatut, {justificatifStatut:t.value});
    return;
  }
  if(t.dataset.appelCheck){ appelSelection[t.dataset.appelCheck] = t.checked; return; }
  if(t.dataset.conseilEleve){ var patch4 = {}; patch4[t.dataset.conseilField] = t.value; setConseil(t.dataset.conseilEleve, ui.trimestre, patch4); return; }
  if(t.dataset.sheetDate){ setConseil(t.dataset.sheetDate, ui.trimestre, { date: t.value }); return; }

  if(t.dataset.profilRole){
    if(!canManageUsers()) return;
    var pid = t.dataset.profilRole, newRole = t.value;
    callAdminApi('/api/admin-update-user', {userId:pid, role:newRole})
      .then(function(){ loadProfiles(); })
      .catch(function(err){ alert('Erreur : '+(err.message||err)); loadProfiles(); });
    return;
  }
  if(t.dataset.profilNom){
    if(!canManageUsers()) return;
    var pid2 = t.dataset.profilNom, nomVal = t.value;
    callAdminApi('/api/admin-update-user', {userId:pid2, nomComplet:nomVal})
      .then(function(){ loadProfiles(); })
      .catch(function(err){ alert('Erreur : '+(err.message||err)); });
    return;
  }
});

/* ================= boot ================= */
boot();
})();
</script>
